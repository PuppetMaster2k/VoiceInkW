name: Windows (Rust)

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: windows

env:
  # whisper.cpp would otherwise tune itself to the CPU of whichever runner
  # builds it (sometimes AVX-512); target AVX2 so the release runs everywhere.
  GGML_NATIVE: "OFF"

# Releases are numbered from the previous tag, so two runs on main must not overlap.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # create the tag and release
      issues: write # create the release:* labels
      pull-requests: read # read the merged pull request's labels
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and commit messages decide the next version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          # whisper.cpp's build does not track GGML_* changes; bump to rebuild it.
          key: ggml-avx2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      # Every push to main that changes the app is released. The version is the
      # latest vX.Y.Z tag bumped by the pull request label (or a "Release: ..."
      # commit trailer): release:major, release:minor, otherwise patch; release:skip
      # builds without releasing. See windows/CONTRIBUTING-windows.md.
      - name: Plan release
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
              labels=$PR_LABELS
              messages=""
          else
              labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[].labels[].name] | join(" ")' || true)
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                  messages=$(git log --format=%B "$BEFORE..$GITHUB_SHA")
              else
                  messages=$(git log -1 --format=%B)
              fi
          fi
          # A commit only asks for a bump with a trailer line of its own ("Release: minor"),
          # so describing the markers in prose does not trigger them.
          marked() { [[ " $labels " == *" release:$1 "* ]] || grep -qixE "release: *$1" <<< "$messages"; }
          if marked skip; then bump=skip
          elif marked major; then bump=major
          elif marked minor; then bump=minor
          else bump=patch
          fi

          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          cargo=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)
          version=$(scripts/next-version.sh "${bump/skip/patch}" "$latest" "$cargo")

          release=false
          if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/main && $bump != skip ]]; then
              if [[ -n $(git tag --points-at HEAD --list 'v*') ]]; then
                  echo "this commit is already released"
              else
                  release=true
              fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "latest ${latest:-none}, bump $bump -> v$version, release: $release" | tee -a "$GITHUB_STEP_SUMMARY"
      # The tag is the source of truth; Cargo.toml is stamped so the exe reports the released version.
      - name: Stamp version
        if: steps.plan.outputs.release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          sed -i -E "0,/^version = /s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i -E "/^name = \"voiceink-windows\"$/{n;s/^version = \".*\"/version = \"$VERSION\"/}" Cargo.lock
          git diff --stat
      - name: Build release
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: voiceink-windows
          path: windows/target/release/voiceink.exe
      - name: Package
        if: steps.plan.outputs.release == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          $name = "VoiceInk-$env:VERSION-win-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/voiceink.exe, README.md, ../LICENSE "dist/$name"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
      - name: Tag and release
        if: steps.plan.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          foreach ($label in @(
              @('release:minor', '0E8A16', 'Bigger feature: bump the minor version on release'),
              @('release:major', 'B60205', 'Milestone: bump the major version on release'),
              @('release:skip', 'CCCCCC', 'Do not create a release for this change'))) {
              gh label create $label[0] --color $label[1] --description $label[2] 2>$null
          }
          gh release create "v$env:VERSION" "dist/VoiceInk-$env:VERSION-win-x64.zip" --target $env:GITHUB_SHA --title "v$env:VERSION" --generate-notes
