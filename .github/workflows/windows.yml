name: Windows (Rust)

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: windows

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: voiceink-windows
          path: windows/target/release/voiceink.exe
      - name: Tag and release
          if: steps.plan.outputs.release == 'true'
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            $tag = 'v${{ steps.plan.outputs.version }}'
            $assets = Get-ChildItem "../release/windows/$tag" -File | ForEach-Object FullName
            gh release create $tag @assets --target '${{ github.sha }}' --title $tag --generate-notes