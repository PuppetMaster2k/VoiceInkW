name: Windows (.NET)

# Pull requests: bump the version from the PR label / branch prefix, test, and build an "-rc" package (workflow artifact).
# Push to main: test, build the release package, then create the vX.Y.Z tag and GitHub release (skipped if the tag exists).
on:
  push:
    branches: [main]
    paths:
      - "windows-dotnet/**"
      - ".github/workflows/windows-dotnet.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "windows-dotnet/**"
      - ".github/workflows/windows-dotnet.yml"
  workflow_dispatch:

concurrency:
  group: windows-dotnet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: pwsh
    working-directory: windows-dotnet

jobs:
  # Same-repo PRs only (fork PRs can't be pushed to): commits the version bump onto the PR branch.
  # Kind comes from the label feature | fix | breaking, else the branch prefix (feature/, feat/, fix/, bugfix/, breaking/).
  # Label "no-release" skips the bump (docs, CI, ...); nothing is released for it.
  bump:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Bump version
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BRANCH: ${{ github.head_ref }}
        run: |
          $labels = $env:LABELS | ConvertFrom-Json
          if ($labels -contains 'no-release') { Write-Output 'no-release label: version left unchanged.'; return }
          $kind = @('breaking', 'feature', 'fix') | Where-Object { $labels -contains $_ } | Select-Object -First 1
          if (-not $kind) {
              $kind = switch -Regex ($env:BRANCH) {
                  '^breaking/'       { 'breaking' }
                  '^(feature|feat)/' { 'feature' }
                  '^(fix|bugfix)/'   { 'fix' }
              }
          }
          if (-not $kind) {
              throw "Cannot tell the change kind: add a label (feature, fix, breaking, or no-release) or name the branch feature/..., fix/... or breaking/..."
          }
          ./scripts/bump-version.ps1 -Kind $kind
          if (git status --porcelain -- src/VoiceInk.App/VoiceInk.App.csproj) {
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add src/VoiceInk.App/VoiceInk.App.csproj
              git commit -m "Bump version ($kind)"
              git push
          }

  build:
    needs: bump
    # Run even when bump was skipped (fork PRs, pushes); not when it failed.
    if: ${{ !cancelled() && needs.bump.result != 'failure' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PRs: the branch tip including the bump commit (same-repo), else the default merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows-dotnet/global.json
      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/Version.ps1
          $version = Get-ProjectVersion (Get-Content -LiteralPath $script:AppProject -Raw)
          $release = '${{ github.event_name }}' -eq 'push' -and '${{ github.ref_name }}' -eq 'main'
          if ($release) {
              gh release view "v$version" *> $null
              if ($LASTEXITCODE -eq 0) { Write-Output "Release v$version already exists; nothing to publish."; $release = $false }
              $global:LASTEXITCODE = 0
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Restore
        run: dotnet restore VoiceInk.slnx
      - name: Test core
        run: dotnet test tests/VoiceInk.Core.Tests -c Release
      - name: Package (NativeAOT, x64)
        run: |
          # The NativeAOT linker step needs vswhere on PATH.
          $env:PATH += ";${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          ./scripts/package-nativeaot.ps1 -Architecture x64
      - name: Checksums
        run: |
          Get-ChildItem ../release/windows -Recurse -Filter *.zip | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: voiceink-windows-dotnet
          path: |
            release/windows/**/*.zip
            release/windows/**/*.sha256
      - name: Tag and release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.plan.outputs.version }}'
          $assets = Get-ChildItem "../release/windows/$tag" -File | ForEach-Object FullName
          gh release create $tag @assets --target '${{ github.sha }}' --title $tag --generate-notes
